name: Daily Boutiqaat Scraper

on:
  schedule:
    # Runs daily at 4:00 AM UTC (adjust timezone as needed)
    - cron: '0 4 * * *'
  
  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scraper: [men_apparel_sub1, men_apparel_sub2]
      fail-fast: false  # Continue running other jobs even if one fails
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps
      
      - name: Run ${{ matrix.scraper }} Scraper
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          echo "Starting ${{ matrix.scraper }} Pipeline..."
          python -m ${{ matrix.scraper }}.main
      
      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ matrix.scraper }}
          path: |
            **/*.log
          retention-days: 7
